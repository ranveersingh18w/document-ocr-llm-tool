services:
  - type: web
    name: document-processor
    env: python
    region: oregon
    plan: free
    buildCommand: cd document-processor-app/backend && pip install -r requirements.txt
    startCommand: cd document-processor-app/backend && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
